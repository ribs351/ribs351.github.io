<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ribs351 · terminal</title>
</head>
<body>

<div class="wrapper">

  <div class="hint" id="hint">
    <span class="hint-label">try:</span>
    <span class="hint-item">whoami</span>
    <span class="hint-sep">·</span>
    <span class="hint-item">projects</span>
    <span class="hint-sep">·</span>
    <span class="hint-item">contact</span>
    <span class="hint-sep">·</span>
    <span class="hint-item">help</span>
  </div>

  <div class="terminal" id="terminal">
    <div class="titlebar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="titlebar-label">ribs351@github.io — zsh</span>
    </div>

    <div class="screen" id="screen"></div>

    <div class="input-row disabled" id="inputRow">
      <span class="prompt-symbol">$</span>
      <div class="input-visible" id="inputVisible">
        <span class="typed-text" id="typedText"></span>
        <span class="cursor" id="cursor"></span>
      </div>
      <input type="text" id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>

</div>
<script src="terminal.js"></script>
</body>
</html>
